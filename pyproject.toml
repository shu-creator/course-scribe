[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course-scribe"
version = "0.1.0"
description = "Syllabus-aligned lecture summarization and exam question generator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "pdfplumber>=0.10.0",
    "click>=8.0",
    "python-docx>=1.0.0",
    "python-pptx>=0.6.21",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
all = [
    "course-scribe[ocr,dev]",
]

[project.scripts]
course-scribe = "course_scribe.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/course_scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
